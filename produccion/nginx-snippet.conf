# Pega esto dentro de tu bloque server {} en Nginx (HTTP o HTTPS).
# Reemplaza tu-dominio.duckdns.org con tu dominio real.
#
# Acceso externo: https://tu-dominio.duckdns.org/yt-downloader

location /yt-downloader {
    proxy_pass         http://127.0.0.1:7788;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Necesario para SSE (Server-Sent Events) y streaming de archivos
    proxy_buffering           off;
    proxy_cache               off;
    proxy_read_timeout        600s;
    proxy_http_version        1.1;
    proxy_set_header          Connection "";
    chunked_transfer_encoding on;
}
